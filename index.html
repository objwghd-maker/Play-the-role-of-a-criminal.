<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NOVA METRO v4 — 10★ War Machines &amp; Multiplayer</title>
<style>:root {
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  --bg: #0e1220;
  --hud: rgba(8, 14, 26, 0.56);
  --hud-strong: rgba(8, 14, 26, 0.78);
  --fg: #eef4ff;
  color-scheme: dark;
}

html {
  scroll-padding-top: env(safe-area-inset-top, 0px);
}

html,
body,
#app,#root {
  height: 100%;
  width: 100%;
  margin: 0;
  overflow: hidden;
  background: var(--bg);
  touch-action: none;
  -webkit-user-select: none;
  user-select: none;
  font: 12px/1.4 ui-monospace, Menlo, Consolas, monospace;
  color: var(--fg);
}

.nova-metro-root {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #0e1220;
}

.nova-metro-root canvas {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
}

.nova-metro-root .p {
  position: fixed;
  background: var(--hud);
  padding: 5px 9px;
  border-radius: 10px;
  white-space: pre;
  border: 1px solid rgba(255, 255, 255, 0.14);
}

/* Compact Perf Badge (tap to expand full diagnostics) */
#st {
  left: calc(8px + env(safe-area-inset-left, 0px));
  top: calc(env(safe-area-inset-top, 0px) + 8px);
  font-size: 10px;
  line-height: 1.35;
  z-index: 4;
  cursor: pointer;
  max-width: 175px;
  overflow: hidden;
  color: #cbd5e1;
}

#st.expanded {
  max-width: none;
  background: var(--hud-strong);
  z-index: 14;
}

#hp {
  left: calc(8px + env(safe-area-inset-left, 0px));
  top: calc(env(safe-area-inset-top, 0px) + 34px);
  width: 138px;
  z-index: 4;
  font-size: 10px;
  padding: 5px 8px;
  background: var(--hud);
  color: #fff;
  border: 1px solid rgba(255, 255, 255, 0.16);
}

#hbar {
  height: 6px;
  margin-top: 4px;
  background: rgba(255, 255, 255, 0.22);
  border-radius: 6px;
  overflow: hidden;
}

#hfill {
  height: 100%;
  width: 100%;
  background: linear-gradient(90deg, #35d879, #b7f36b);
  border-radius: 6px;
  transition: width 0.15s;
}

#hp small {
  display: block;
  margin-top: 2px;
  opacity: 0.78;
  font-size: 9px;
}

#mpBadge {
  position: fixed;
  z-index: 4;
  left: calc(8px + env(safe-area-inset-left, 0px));
  top: calc(env(safe-area-inset-top, 0px) + 84px);
  display: none;
  align-items: center;
  gap: 5px;
  padding: 3px 8px;
  border-radius: 8px;
  border: 1px solid rgba(94, 234, 212, 0.34);
  background: var(--hud);
  color: #a7f3d0;
  font: 700 10px system-ui, sans-serif;
  cursor: pointer;
}

#milRadar {
  position: fixed;
  z-index: 4;
  left: 50%;
  top: calc(env(safe-area-inset-top, 0px) + 8px);
  transform: translateX(-50%);
  display: none;
  align-items: center;
  gap: 7px;
  padding: 4px 10px;
  border-radius: 10px;
  border: 1px solid rgba(125, 211, 252, 0.3);
  background: var(--hud);
  font: 700 11px system-ui, sans-serif;
  font-variant-numeric: tabular-nums;
  pointer-events: none;
  white-space: nowrap;
}

.milPing {
  display: inline-flex;
  align-items: center;
  gap: 3px;
}

.milArrow {
  display: inline-block;
  font-size: 10px;
  color: #38bdf8;
}

#creatorTag {
  position: fixed;
  z-index: 3;
  left: 50%;
  top: calc(env(safe-area-inset-top, 0px) + 34px);
  transform: translateX(-50%);
  display: none;
  padding: 3px 10px;
  border: 1px solid rgba(255, 215, 107, 0.55);
  border-radius: 10px;
  background: rgba(96, 36, 12, 0.65);
  color: #fff2bd;
  font: 800 10px system-ui;
  letter-spacing: 0.6px;
}

/* Compact Top-Right Utility Row + Wanted / Cash Readout */
#topRightTools {
  position: fixed;
  z-index: 12;
  right: calc(8px + env(safe-area-inset-right, 0px));
  top: calc(env(safe-area-inset-top, 0px) + 8px);
  display: flex;
  align-items: center;
  gap: 5px;
}

#qualityBtn,
#timeBtn,
#mapBtn,
#musicToggle,
#worldResetHudBtn,
#hudDownload {
  height: 30px;
  border: 1px solid rgba(255, 255, 255, 0.24);
  border-radius: 9px;
  background: var(--hud);
  color: #eef4ff;
  font: 700 11px system-ui, sans-serif;
  padding: 0 8px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  text-decoration: none;
  white-space: nowrap;
}

#mapBtn {
  border-color: rgba(112, 215, 255, 0.45);
  color: #cff5ff;
}

#timeBtn {
  border-color: rgba(255, 226, 139, 0.4);
  color: #ffeaa8;
}

#worldResetHudBtn {
  border-color: rgba(251, 113, 133, 0.42);
  color: #fecdd3;
}

#musicToggle {
  width: 32px;
  font-size: 14px;
  padding: 0;
}

#hudDownload {
  border-color: rgba(92, 240, 181, 0.45);
  color: #b8ffe3;
}

#hd {
  right: calc(8px + env(safe-area-inset-right, 0px));
  top: calc(env(safe-area-inset-top, 0px) + 42px);
  text-align: right;
  font-size: 11px;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
  pointer-events: none;
  z-index: 4;
  padding: 4px 8px;
}

#camBtn {
  position: fixed;
  z-index: 12;
  right: calc(8px + env(safe-area-inset-right, 0px));
  top: calc(env(safe-area-inset-top, 0px) + 106px);
  height: 28px;
  border: 1px solid rgba(255, 255, 255, 0.25);
  border-radius: 9px;
  background: var(--hud);
  color: #e2e8f0;
  font: 700 10px system-ui, sans-serif;
  padding: 0 9px;
  cursor: pointer;
  white-space: nowrap;
}

@media (max-width: 680px) {
  #qualityBtn,
  #timeBtn,
  #mapBtn,
  #musicToggle,
  #worldResetHudBtn,
  #hudDownload {
    height: 28px;
    font-size: 10px;
    padding: 0 6px;
  }
  #musicToggle {
    width: 28px;
    font-size: 13px;
    padding: 0;
  }
}

#ht {
  left: 50%;
  transform: translateX(-50%);
  bottom: calc(env(safe-area-inset-bottom, 0px) + 84px);
  font-size: 11px;
  transition: opacity 0.6s;
  pointer-events: none;
  text-align: center;
  z-index: 4;
  max-width: 84vw;
  background: var(--hud-strong);
}

/* Fullscreen Look + 2-Finger Pinch Layer behind HUD & Joystick */
#lz {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  z-index: 1;
  touch-action: none;
}

#jz {
  position: fixed;
  left: 0;
  bottom: 0;
  width: 38%;
  height: 44%;
  z-index: 2;
  touch-action: none;
}

#jk {
  position: fixed;
  width: 88px;
  height: 88px;
  margin: -44px 0 0 -44px;
  border: 2px solid rgba(255, 255, 255, 0.5);
  border-radius: 50%;
  display: none;
  pointer-events: none;
  z-index: 3;
}

#jn {
  position: absolute;
  left: 28px;
  top: 28px;
  width: 32px;
  height: 32px;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.84);
}

/* Compact Translucent Edge Action Cluster (44px+ hit targets) */
.b {
  position: fixed;
  z-index: 12;
  width: 48px;
  height: 48px;
  border-radius: 50%;
  border: 1px solid rgba(255, 255, 255, 0.24);
  font: 700 12px system-ui, sans-serif;
  background: var(--hud);
  color: var(--fg);
  cursor: pointer;
  touch-action: none;
  transition: transform 0.12s ease;
}

.b:active {
  transform: scale(0.92);
}

#fi {
  right: calc(14px + env(safe-area-inset-right, 0px));
  bottom: calc(env(safe-area-inset-bottom, 0px) + 18px);
  width: 58px;
  height: 58px;
  background: rgba(239, 68, 68, 0.78);
  border-color: rgba(254, 202, 202, 0.6);
  color: #fff;
  font-size: 14px;
  font-weight: 800;
}

#ac {
  right: calc(80px + env(safe-area-inset-right, 0px));
  bottom: calc(env(safe-area-inset-bottom, 0px) + 14px);
  width: 46px;
  height: 46px;
}

#jumpBtn {
  right: calc(18px + env(safe-area-inset-right, 0px));
  bottom: calc(env(safe-area-inset-bottom, 0px) + 84px);
  width: 46px;
  height: 46px;
  border-color: rgba(110, 205, 255, 0.45);
  color: #d6f3ff;
}

#crouchBtn {
  right: calc(74px + env(safe-area-inset-right, 0px));
  bottom: calc(env(safe-area-inset-bottom, 0px) + 70px);
  width: 44px;
  height: 44px;
  border-color: rgba(255, 210, 120, 0.42);
  color: #ffe7ad;
}

#adsBtn {
  right: calc(74px + env(safe-area-inset-right, 0px));
  bottom: calc(env(safe-area-inset-bottom, 0px) + 122px);
  width: 44px;
  height: 44px;
  border-color: rgba(120, 215, 255, 0.42);
  color: #d6f7ff;
}

#spawnerBtn {
  position: fixed;
  z-index: 12;
  left: calc(10px + env(safe-area-inset-left, 0px));
  bottom: calc(env(safe-area-inset-bottom, 0px) + 12px);
  display: none;
  height: 36px;
  border: 1px solid rgba(94, 234, 212, 0.45);
  border-radius: 10px;
  padding: 0 10px;
  background: var(--hud);
  color: #ccfbf1;
  font: 700 11px system-ui, sans-serif;
  cursor: pointer;
  white-space: nowrap;
}

#weaponQuickBtn {
  position: fixed;
  z-index: 12;
  right: calc(134px + env(safe-area-inset-right, 0px));
  bottom: calc(env(safe-area-inset-bottom, 0px) + 14px);
  display: none;
  height: 44px;
  min-width: 48px;
  border: 1px solid rgba(255, 215, 107, 0.45);
  border-radius: 14px;
  padding: 0 10px;
  background: var(--hud);
  color: #fef3c7;
  font: 700 11px system-ui, sans-serif;
  cursor: pointer;
  touch-action: none;
  white-space: nowrap;
}

/* Character-Hold Radial Weapon Wheel */
#weaponWheel {
  position: fixed;
  left: 50%;
  top: 50%;
  width: 224px;
  height: 224px;
  transform: translate(-50%, -50%) scale(0.75);
  opacity: 0;
  pointer-events: none;
  z-index: 22;
  transition: transform 0.14s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.14s ease;
}

#weaponWheel.open {
  opacity: 1;
  transform: translate(-50%, -50%) scale(1);
}

#weaponWheelRing {
  position: absolute;
  inset: 0;
  border-radius: 50%;
  border: 1.5px solid rgba(125, 211, 252, 0.45);
  background: radial-gradient(circle, rgba(10, 18, 34, 0.35) 26%, rgba(8, 14, 26, 0.86) 68%);
  box-shadow: 0 12px 42px rgba(0, 0, 0, 0.65);
}

.wheelItem {
  position: absolute;
  left: 50%;
  top: 50%;
  width: 68px;
  height: 46px;
  margin: -23px 0 0 -34px;
  border-radius: 12px;
  border: 1px solid rgba(148, 163, 184, 0.36);
  background: rgba(15, 23, 42, 0.88);
  color: #e2e8f0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  font: 800 11px system-ui, sans-serif;
  text-align: center;
  line-height: 1.15;
  transition: transform 0.1s ease, border-color 0.1s ease, background 0.1s ease;
}

.wheelItem small {
  font-size: 9px;
  font-weight: 600;
  color: #94a3b8;
}

.wheelItem.active {
  border-color: #38bdf8;
  background: rgba(14, 116, 144, 0.88);
  color: #fff;
  transform: scale(1.12);
  box-shadow: 0 0 16px rgba(56, 189, 248, 0.5);
}

#wheelCenter {
  position: absolute;
  left: 50%;
  top: 50%;
  width: 62px;
  height: 62px;
  margin: -31px 0 0 -31px;
  border-radius: 50%;
  border: 1.5px solid rgba(255, 210, 120, 0.5);
  background: rgba(15, 23, 42, 0.94);
  color: #fde68a;
  display: flex;
  align-items: center;
  justify-content: center;
  font: 800 10px system-ui, sans-serif;
  text-align: center;
  transition: transform 0.1s ease, background 0.1s ease;
}

#wheelCenter.active {
  border-color: #fbbf24;
  background: rgba(146, 64, 14, 0.92);
  color: #fff;
  transform: scale(1.1);
}

/* Pooled Overhead Health Bars for Enemy Tanks, Jets & Mechs */
#enemyHpLayer {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 3;
  overflow: hidden;
}

.enemyHpSlot {
  position: fixed;
  left: 0;
  top: 0;
  display: none;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  width: 72px;
  will-change: transform;
}

.enemyHpLabel {
  font: 800 9px system-ui, sans-serif;
  color: #f8fafc;
  text-shadow: 0 1px 3px #000;
  white-space: nowrap;
}

.enemyHpTrack {
  width: 64px;
  height: 5px;
  border-radius: 4px;
  background: rgba(0, 0, 0, 0.65);
  border: 1px solid rgba(255, 255, 255, 0.25);
  overflow: hidden;
}

.enemyHpFill {
  height: 100%;
  width: 100%;
  background: linear-gradient(90deg, #ef4444, #f59e0b);
}

#crosshair {
  position: fixed;
  left: 50%;
  top: 50%;
  width: 22px;
  height: 22px;
  transform: translate(-50%, -50%);
  pointer-events: none;
  z-index: 4;
  display: none;
}

#crosshair b {
  position: absolute;
  left: 10px;
  top: 10px;
  width: 2px;
  height: 2px;
  border-radius: 50%;
  background: #fff;
  box-shadow: 0 0 3px #000;
}

#crosshair i {
  position: absolute;
  background: rgba(255, 255, 255, 0.92);
  box-shadow: 0 0 3px #000b;
}

#crosshair .ch-t { left: 10px; top: 1px; width: 2px; height: 6px; }
#crosshair .ch-b { left: 10px; bottom: 1px; width: 2px; height: 6px; }
#crosshair .ch-l { top: 10px; left: 1px; width: 6px; height: 2px; }
#crosshair .ch-r { top: 10px; right: 1px; width: 6px; height: 2px; }

#fs {
  left: 50%;
  transform: translateX(-50%);
  top: auto;
  bottom: calc(env(safe-area-inset-bottom, 0px) + 12px);
  width: 42px;
  height: 42px;
  border-radius: 12px;
  font-size: 16px;
  z-index: 12;
}

.skillBtn {
  position: fixed;
  z-index: 12;
  bottom: calc(env(safe-area-inset-bottom, 0px) + 12px);
  width: 48px;
  height: 48px;
  border-radius: 14px;
  border: 1.5px solid rgba(255, 255, 255, 0.55);
  font: 900 18px system-ui;
  display: none;
  touch-action: manipulation;
  cursor: pointer;
}

.skillBtn:active {
  transform: scale(0.92);
}

#skillGold {
  left: calc(50% - 88px);
  background: rgba(180, 122, 24, 0.85);
  color: #fff6cf;
  border-color: rgba(255, 232, 160, 0.7);
}

#skillRed {
  left: calc(50% + 40px);
  background: rgba(185, 28, 44, 0.85);
  color: #fff;
  border-color: rgba(255, 192, 192, 0.7);
}

#steal {
  position: fixed;
  z-index: 12;
  left: 50%;
  transform: translateX(-50%);
  bottom: calc(env(safe-area-inset-bottom, 0px) + 66px);
  display: none;
  border: 1px solid rgba(255, 255, 255, 0.45);
  border-radius: 12px;
  padding: 9px 16px;
  background: rgba(234, 88, 12, 0.88);
  color: #fff;
  font: 800 13px system-ui;
  touch-action: none;
  cursor: pointer;
  white-space: nowrap;
}

#rot {
  position: fixed;
  inset: 0;
  z-index: 9;
  display: none;
  align-items: center;
  justify-content: center;
  background: rgba(8, 12, 22, 0.86);
  color: #fff;
  font: 700 17px/1.6 system-ui, sans-serif;
  text-align: center;
  padding: 24px;
}

@media (orientation: portrait) {
  #rot {
    display: flex;
  }
}

#worldLoading {
  position: fixed;
  inset: 0;
  z-index: 25;
  display: none;
  align-items: center;
  justify-content: center;
  background: rgba(5, 10, 19, 0.96);
  color: #fff;
  font: 14px system-ui;
}

#worldLoadingCard {
  width: min(340px, 84vw);
  padding: 22px;
  border: 1px solid #65cfff77;
  border-radius: 16px;
  background: #101a2a;
  text-align: center;
  box-shadow: 0 12px 44px #000b;
}

#worldLoadingCard b {
  display: block;
  color: #9ce7ff;
  font-size: 22px;
  letter-spacing: 3px;
  margin-bottom: 14px;
}

#worldLoadingCard span {
  display: block;
  margin-bottom: 12px;
}

#worldLoadingTrack {
  height: 9px;
  border-radius: 10px;
  background: #ffffff25;
  overflow: hidden;
}

#worldLoadingFill {
  display: block;
  width: 0;
  height: 100%;
  background: linear-gradient(90deg, #18b9ed, #7cf0c5);
  transition: width 0.15s;
}

#worldLoadingPct {
  display: block;
  margin-top: 9px;
  color: #b9c8dc;
}

/* Balanced 2-Column Server & Loadout Portal inside Engine / Standalone */
#login {
  position: fixed;
  inset: 0;
  z-index: 20;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow-y: auto;
  background: radial-gradient(circle at 50% 25%, #192b48, #070b14 74%);
  color: #fff;
  font: 14px system-ui;
  padding: 16px;
  box-sizing: border-box;
}

#loginCard {
  width: min(820px, 95vw);
  max-height: 92dvh;
  overflow-y: auto;
  overscroll-behavior: contain;
  touch-action: pan-y;
  -webkit-overflow-scrolling: touch;
  padding: 20px;
  border: 1px solid rgba(100, 116, 139, 0.45);
  border-radius: 20px;
  background: #0d1526;
  box-shadow: 0 20px 70px #000c;
  text-align: left;
}

.loginHeaderRow {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding-bottom: 12px;
  margin-bottom: 14px;
  border-bottom: 1px solid rgba(148, 163, 184, 0.18);
}

#loginCard h1 {
  margin: 0;
  font: 900 22px system-ui;
  letter-spacing: 2px;
  color: #f8fafc;
}

#loginCard p {
  margin: 2px 0 0;
  color: #94a3b8;
  font-size: 12px;
}

.loginGrid2Col {
  display: grid;
  grid-template-columns: 1.25fr 1fr;
  gap: 16px;
  align-items: stretch;
}

@media (max-width: 720px) {
  .loginGrid2Col {
    grid-template-columns: 1fr;
  }
}

.loginColSection {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.loginFieldLabel {
  display: block;
  font: 700 11px system-ui;
  color: #cbd5e1;
  margin-bottom: 4px;
}

.loginServerPanel {
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  gap: 10px;
  padding: 12px;
  border-radius: 14px;
  border: 1px solid rgba(148, 163, 184, 0.22);
  background: rgba(7, 11, 20, 0.72);
}

#savedWorldsList {
  display: flex;
  flex-direction: column;
  gap: 6px;
  max-height: 150px;
  overflow-y: auto;
}

.savedWorldItem {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 6px;
  padding: 7px 9px;
  border-radius: 10px;
  border: 1px solid rgba(148, 163, 184, 0.2);
  background: rgba(15, 23, 42, 0.75);
}

.savedWorldItem.active {
  border-color: #38bdf8;
  background: rgba(14, 116, 144, 0.25);
}

.savedWorldSelect {
  flex: 1;
  text-align: left;
  background: transparent;
  border: 0;
  color: #f8fafc;
  padding: 0;
  cursor: pointer;
  min-width: 0;
}

.savedWorldSelect strong {
  display: block;
  font: 800 12px system-ui;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.savedWorldSelect small {
  display: block;
  font: 500 10px system-ui;
  color: #94a3b8;
  font-variant-numeric: tabular-nums;
}

.savedWorldReset {
  border: 1px solid rgba(251, 113, 133, 0.45);
  border-radius: 7px;
  background: rgba(136, 19, 55, 0.35);
  color: #fecdd3;
  font: 700 10px system-ui;
  padding: 5px 7px;
  cursor: pointer;
  white-space: nowrap;
}

#mapPickGrid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 7px;
}

#careerGrid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 6px;
}

#viewPresetRow {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 6px;
}

#loginCard .mapPickBtn,
#loginCard .careerBtn,
#loginCard .viewBtn {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  text-align: left;
  gap: 2px;
  padding: 8px 10px;
  border-radius: 10px;
  border: 1.5px solid #334155;
  background: #070d19;
  color: #cfe0f5;
  cursor: pointer;
  transition: border-color 0.16s, background 0.16s;
}

#loginCard .viewBtn {
  align-items: center;
  text-align: center;
  padding: 7px 6px;
}

#loginCard .mapPickBtn strong,
#loginCard .careerBtn strong,
#loginCard .viewBtn strong {
  font: 800 12px system-ui, sans-serif;
  color: #f0f6ff;
}

#loginCard .mapPickBtn small,
#loginCard .careerBtn small,
#loginCard .viewBtn small {
  font: 500 10px/1.3 system-ui, sans-serif;
  color: #93acc9;
}

#loginCard .mapPickBtn.active,
#loginCard .careerBtn.active,
#loginCard .viewBtn.active {
  border-color: #38bdf8;
  background: #0f2944;
}

#loginCard .mapPickBtn.active strong,
#loginCard .careerBtn.active strong,
#loginCard .viewBtn.active strong {
  color: #7dd3fc;
}

.loginRow2 {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}

#loginCard input {
  display: block;
  width: 100%;
  box-sizing: border-box;
  margin: 0;
  padding: 9px 11px;
  border-radius: 10px;
  border: 1px solid #475569;
  background: #070d19;
  color: #fff;
  font: 13px system-ui;
  outline: none;
}

#loginCard #loginGo {
  width: 100%;
  padding: 12px;
  border: 0;
  border-radius: 11px;
  background: linear-gradient(120deg, #0ea5e9, #2563eb);
  color: #fff;
  font: 800 14px system-ui;
  cursor: pointer;
}

#loginCard #loginDownload {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  padding: 7px 12px;
  border: 1px solid #5cf0b577;
  border-radius: 9px;
  background: #0e2c26;
  color: #b6ffe2;
  font: 700 11px system-ui;
  text-decoration: none;
  cursor: pointer;
  white-space: nowrap;
}

#loginMsg {
  min-height: 16px;
  color: #ffd17b;
  font-size: 11px;
}

#mpChatBox {
  position: fixed;
  z-index: 16;
  left: calc(8px + env(safe-area-inset-left, 0px));
  bottom: calc(env(safe-area-inset-bottom, 0px) + 56px);
  width: min(240px, 42vw);
  display: none;
  flex-direction: column;
  gap: 4px;
  padding: 7px 9px;
  border-radius: 11px;
  border: 1px solid rgba(148, 163, 184, 0.3);
  background: rgba(7, 12, 22, 0.86);
  font: 11px/1.35 system-ui, sans-serif;
}

#mpChatLog {
  max-height: 76px;
  overflow-y: auto;
  color: #dbeafe;
  word-break: break-word;
}

#mpChatForm {
  display: flex;
  gap: 4px;
}

#mpChatInput {
  flex: 1;
  min-width: 0;
  border: 1px solid #475569;
  border-radius: 7px;
  background: #0f172a;
  color: #fff;
  padding: 5px 7px;
  font: 11px system-ui;
  outline: none;
}

#mpChatSend {
  border: 1px solid #38bdf888;
  border-radius: 7px;
  background: #164e63;
  color: #e0f2fe;
  padding: 4px 8px;
  font: 700 11px system-ui;
  cursor: pointer;
}

#nukeFlash {
  position: fixed;
  inset: 0;
  z-index: 33;
  pointer-events: none;
  background: radial-gradient(circle, #fffbeb, #f97316 45%, #7f1d1d 85%);
  opacity: 0;
  transition: opacity 0.25s ease-out;
}

#finaleOverlay {
  position: fixed;
  inset: 0;
  z-index: 34;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 18px;
  background: radial-gradient(circle at 50% 35%, rgba(127, 29, 29, 0.65), rgba(5, 8, 16, 0.94) 75%);
  font-family: system-ui, sans-serif;
}

#finaleCard {
  width: min(440px, 94vw);
  padding: 22px;
  border-radius: 20px;
  border: 1.5px solid rgba(251, 146, 60, 0.7);
  background: rgba(14, 18, 30, 0.96);
  box-shadow: 0 20px 70px #000d;
  text-align: center;
  color: #fff;
}

#finaleCard h2 {
  margin: 0 0 8px;
  font-size: 22px;
  font-weight: 900;
  color: #fdba74;
}

#finaleCard p {
  margin: 0 0 14px;
  font-size: 13px;
  color: #cbd5e1;
  line-height: 1.5;
}

#finaleStats {
  padding: 10px 12px;
  border-radius: 10px;
  background: rgba(30, 41, 59, 0.75);
  border: 1px solid rgba(148, 163, 184, 0.25);
  margin-bottom: 16px;
  font-size: 12px;
  color: #e2e8f0;
}

#finaleActions {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

#finaleFreeBtn {
  padding: 12px;
  border-radius: 11px;
  border: 0;
  background: linear-gradient(120deg, #10b981, #06b6d4);
  color: #06211c;
  font: 900 14px system-ui;
  cursor: pointer;
}

#finaleResetBtn {
  padding: 10px;
  border-radius: 11px;
  border: 1px solid #fb718588;
  background: #3f1422;
  color: #fecdd3;
  font: 700 13px system-ui;
  cursor: pointer;
}

#doomsdayPanel {
  position: fixed;
  z-index: 26;
  left: 50%;
  bottom: calc(env(safe-area-inset-bottom, 0px) + 74px);
  transform: translateX(-50%);
  width: min(340px, 88vw);
  display: none;
  flex-direction: column;
  gap: 8px;
  padding: 12px 14px;
  border-radius: 15px;
  border: 1.5px solid rgba(251, 146, 60, 0.78);
  background: rgba(12, 16, 28, 0.92);
  color: #fff;
  font-family: system-ui, sans-serif;
  box-shadow: 0 12px 36px rgba(0, 0, 0, 0.65);
}

#doomsdayHeader {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  font: 800 12px system-ui;
  color: #fdba74;
}

#doomsdayTimerTxt {
  color: #fca5a5;
  font-variant-numeric: tabular-nums;
}

#doomsdayTrack {
  position: relative;
  height: 16px;
  border-radius: 999px;
  border: 1px solid rgba(255, 255, 255, 0.18);
  background: #0b1220;
  overflow: hidden;
}

#doomsdaySweetZone {
  position: absolute;
  top: 0;
  bottom: 0;
  left: 38%;
  width: 24%;
  background: linear-gradient(90deg, rgba(245, 158, 11, 0.35), rgba(239, 68, 68, 0.85), rgba(245, 158, 11, 0.35));
  border-left: 1px solid #fde047;
  border-right: 1px solid #fde047;
}

#doomsdayNeedle {
  position: absolute;
  top: 1px;
  bottom: 1px;
  left: 0%;
  width: 6px;
  margin-left: -3px;
  border-radius: 999px;
  background: #ffffff;
  box-shadow: 0 0 8px #fde047;
}

#doomsdayBtns {
  display: flex;
  gap: 8px;
}

#doomsdayDetonateBtn {
  flex: 1;
  border: 0;
  border-radius: 10px;
  padding: 9px 10px;
  background: linear-gradient(120deg, #dc2626, #f97316);
  color: #fff;
  font: 900 12px system-ui;
  cursor: pointer;
}

#doomsdayCancelBtn {
  border: 1px solid rgba(148, 163, 184, 0.45);
  border-radius: 10px;
  padding: 9px 12px;
  background: rgba(30, 41, 59, 0.85);
  color: #cbd5e1;
  font: 700 12px system-ui;
  cursor: pointer;
}

#policeTools {
  position: fixed;
  z-index: 18;
  left: 10px;
  top: calc(env(safe-area-inset-top, 0px) + 116px);
  display: none;
  box-sizing: border-box;
  max-height: calc(100dvh - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px) - 128px);
  overflow-y: auto;
  overscroll-behavior: contain;
  touch-action: pan-y;
  -webkit-overflow-scrolling: touch;
  color: #fff;
  background: rgba(14, 22, 38, 0.94);
  border: 1px solid #e8bd5b;
  border-radius: 12px;
  padding: 8px 10px 14px;
  width: 214px;
  font: 11px system-ui;
  box-shadow: 0 5px 20px #0009;
}

#policeToolsHeader {
  position: sticky;
  top: -8px;
  z-index: 2;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  font-weight: 900;
  padding: 6px 0;
  margin-bottom: 4px;
  background: rgba(14, 22, 38, 0.98);
  border-bottom: 1px solid rgba(232, 189, 91, 0.25);
}

#policeTools button {
  border: 1px solid #e9c36c;
  border-radius: 8px;
  background: #62451c;
  color: #fff1c1;
  padding: 7px;
  font: 700 11px system-ui;
  cursor: pointer;
}

#policeTools input {
  width: 76px;
  box-sizing: border-box;
  border: 1px solid #8b9bb2;
  border-radius: 6px;
  padding: 5px;
  background: #07111f;
  color: #fff;
  font: 700 12px system-ui;
}

#policeToggle {
  position: fixed;
  z-index: 15;
  left: 8px;
  top: calc(env(safe-area-inset-top, 0px) + 114px);
  display: none;
  border: 1px solid rgba(232, 189, 91, 0.7);
  border-radius: 9px;
  background: var(--hud);
  color: #fff1c1;
  padding: 5px 9px;
  font: 700 10px system-ui;
  cursor: pointer;
}

@media (max-height: 540px) {
  #policeTools {
    top: calc(env(safe-area-inset-top, 0px) + 8px);
    max-height: calc(100dvh - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px) - 16px);
    width: 224px;
  }
}

#speedTuner {
  position: fixed;
  z-index: 12;
  left: 50%;
  top: calc(env(safe-area-inset-top, 0px) + 42px);
  transform: translateX(-50%);
  display: none;
  flex-direction: column;
  gap: 4px;
  width: min(240px, 44vw);
  padding: 5px 9px;
  border-radius: 11px;
  border: 1px solid rgba(255, 210, 120, 0.4);
  background: var(--hud);
  font-family: system-ui, sans-serif;
}

#speedTunerTop,
#steerTunerRow {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 6px;
}

#steerTunerRow {
  padding-top: 2px;
  border-top: 1px solid rgba(255, 255, 255, 0.12);
}

#speedReadout {
  font: 800 11px ui-monospace, monospace;
  font-variant-numeric: tabular-nums;
  color: #ffe28b;
  white-space: nowrap;
}

#steerReadout {
  font: 800 10px ui-monospace, monospace;
  font-variant-numeric: tabular-nums;
  color: #7dd3fc;
  white-space: nowrap;
}

#speedMaxBtn,
#speedUnlimBtn,
#steerPresetBtn {
  border: 1px solid #ffd46a88;
  border-radius: 6px;
  background: #23314d;
  color: #ffe9a8;
  font: 800 9px system-ui, sans-serif;
  padding: 2px 6px;
  cursor: pointer;
  white-space: nowrap;
}

#steerPresetBtn {
  border-color: #38bdf888;
  background: #142b47;
  color: #bae6fd;
}

#speedUnlimBtn {
  display: none;
  border-color: #ff6e6e99;
  background: #5b1822;
  color: #ffd8d8;
}

#speedCapSlider,
#steerSensSlider {

  cursor: pointer;
  margin: 0;

}

#steerSensSlider {
  accent-color: #38bdf8;
}

#offlineError {

  inset: 0;
  z-index: 30;
  display: none;

  justify-content: center;
  box-sizing: border-box;

}

}

#offlineError p {

}

#ctxLostBanner {

  color: #ffd17b;
  font: 700 16px system-ui, sans-serif;

  padding: 20px;
}

#dlModal {
  position: fixed;
  inset: 0;
  z-index: 35;
  display: none;
  align-items: center;

  padding: 18px;
  box-sizing: border-box;
  font-family: system-ui, sans-serif;
}

#dlModalCard {
  width: min(390px, 94vw);
  padding: 20px;
  border: 1px solid #5cf0b588;

  color: #e9f1ff;
  box-shadow: 0 16px 50px #000b;

}

#dlModalCard h3 {
  margin: 0 0 8px;

  font-size: 18px;
}

#dlModalCard p {

}

}

#dlActions a {
  display: block;
  width: 100%;
  box-sizing: border-box;
  padding: 11px;
  border-radius: 10px;
  border: 1px solid #ffffff33;
  background: #17253d;
  color: #fff;
  font: 700 13px system-ui, sans-serif;
  text-decoration: none;
  cursor: pointer;
}

#dlRetryBtn {
  background: linear-gradient(120deg, #129c76, #1978b8) !important;
  border-color: #6df2c488 !important;
}

#dlCloseBtn {
  background: #1a2130 !important;
  color: #a9b8ce !important;
}

#bootLoading {
  position: fixed;
  inset: 0;
  z-index: 31;
  display: flex;
  align-items: center;
  justify-content: center;
  background: radial-gradient(circle at 50% 30%, #1c3556, #050914 72%);
  color: #fff;
  font: 14px system-ui;
  text-align: center;
}

#bootLoadingCard {
  width: min(340px, 84vw);
  padding: 24px;
  border: 1px solid #65cfff77;
  border-radius: 18px;

  box-shadow: 0 12px 44px #000b;
}

#bootLoadingCard b {
  display: block;
  color: #9ce7ff;
  font-size: 23px;
  letter-spacing: 3px;
  margin-bottom: 12px;
}

#bootLoadingTrack {
  height: 8px;
  margin-top: 16px;
  border-radius: 10px;
  background: #ffffff25;
  overflow: hidden;
}

#bootLoadingTrack i {
  display: block;
  width: 34%;
  height: 100%;
  background: linear-gradient(90deg, #18b9ed, #7cf0c5);
  animation: bootSlide 1.25s ease-in-out infinite alternate;
}

@keyframes bootSlide {
  from {
